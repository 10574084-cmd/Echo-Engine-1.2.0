name: Build PS4 native test (Haxe)

# Native port, step 2b: Haxe code compiled to C++ by hxcpp and built for the PS4 with the OpenOrbis compiler.
# The package shows a notification on the console screen with the result. Run by hand; the package goes to the "native-test" release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'haxe = the Haxe test; linkonly = test C (all of hxcpp linked in but not started)'
        type: choice
        options: [haxe, linkonly]
        default: haxe
      deltas:
        description: 'Crash report: the numbers after "calls:" (space separated) to look up in this build'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Build the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            set -e
            haxelib setup ~/haxelib
            haxelib install hxcpp
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang lld imagemagick >/dev/null
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
            cd /tmp
            for u in http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
                     http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb; do
              curl -fsSL "$u" -o libssl1.1.deb && break
            done
            sudo dpkg -i libssl1.1.deb

            mkdir -p /tmp/tc && cd /tmp/tc
            gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern 'toolchain-llvm-18.tar.gz'
            tar xzf toolchain-llvm-18.tar.gz
            export OO_PS4_TOOLCHAIN=/tmp/tc/OpenOrbis/PS4Toolchain
            chmod +x "$OO_PS4_TOOLCHAIN"/bin/linux/*

            git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain /tmp/oo
            # the piglet sample is the base that is known to start on a console: it brings the system modules (sce_module/*.prx)
            # and the permissions (authinfo) that a package needs to run
            mkdir -p /tmp/work && cp -r /tmp/oo/samples/piglet /tmp/work/piglet
            cd /tmp/work/piglet
            rm -f piglet/*.c piglet/*.cpp piglet/*.hpp piglet/*.h assets/images/rgba_texture.png
            convert "$GITHUB_WORKSPACE/art/iconOG.png" -background none -resize 512x512 -gravity center -extent 512x512 sce_sys/icon0.png
            found=$(find /tmp/tc /tmp/oo -name right.sprx | head -1)
            if [ -n "$found" ]; then cp "$found" sce_sys/about/right.sprx; else sed -i 's# sce_sys/about/right.sprx##' Makefile; fi

            if [ "${{ inputs.mode }}" = "linkonly" ]; then export ECHO_LINKONLY=1; tid=ECHO00017; cid=ECHOTESTC0000000; ttl="Echo Engine Test C"; out=C; else tid=ECHO00014; cid=ECHOHAXETEST0000; ttl="Echo Engine Native Test Haxe"; out=haxe; fi
            bash "$GITHUB_WORKSPACE/apps/ps4/build-hxtest.sh" /tmp/work/piglet

            sed -i \
              -e "s/^TITLE .*/TITLE       := $ttl/" \
              -e 's/^VERSION .*/VERSION     := 1.20/' \
              -e "s/^TITLE_ID .*/TITLE_ID    := $tid/" \
              -e "s/^CONTENT_ID .*/CONTENT_ID  := IV0000-${tid}_00-${cid}/" \
              -e 's/^LIBS .*/LIBS        := -lc -lkernel -lc++/' \
              Makefile
            # nothing to compile in the Makefile itself: the objects are already in x64/Debug
            make
            ls -la *.pkg

            # what the program asks the console for (imported functions): a missing one makes the console refuse to start it
            nm -u piglet/x64/Debug/piglet.elf | awk '{print $NF}' | sort -u | tr '\n' ' ' > /tmp/imports.txt
            python3 -c "t='imports ('+str(len(open('/tmp/imports.txt').read().split()))+'): '+open('/tmp/imports.txt').read(); print('::notice title=Imports::'+t.replace('%','%25').replace('\n','%0A'))"
            readelf -lW piglet/x64/Debug/piglet.elf | grep -E "LOAD|TLS|DYNAMIC|Entry|Type" | head -20 || true

            # symbols: lets a crash report (addresses relative to echo_anchor) be turned into function names
            nm -n piglet/x64/Debug/piglet.elf > /tmp/symbols.txt || true
            python3 "$GITHUB_WORKSPACE/apps/ps4/lookup.py" /tmp/symbols.txt "${{ inputs.deltas }}" | tee /tmp/lookup.txt
            python3 -c "t=open('/tmp/lookup.txt').read().replace('%','%25').replace('\n','%0A'); print('::notice title=Crash lookup::'+t) if t.strip() else None"
            cp ./*.pkg "$GITHUB_WORKSPACE/Echo-Engine-native-test-$out-ps4.pkg"
          } 2>&1 | tee ps4.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tr '\r' '\n' < ps4.log | grep -v 'MB / ' | tail -45 | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=PS4 build failed::'+t)"
          fi
          exit $status

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-test >/dev/null 2>&1 || gh release create native-test --prerelease --title "Native port tests (PS4)" --notes "Test packages for the native PS4 port. For jailbroken consoles (GoldHEN). They are experiments."
          gh release upload native-test Echo-Engine-native-test-*-ps4.pkg --clobber
